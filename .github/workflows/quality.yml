name: MCP quality and public samples
on:
  push:
    branches: [main, 'improve/**']
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', '验收说明.md', 'MANIFEST.sha256']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r src/requirements.txt
      - run: python -B -m unittest discover -s tests -v
  public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r src/requirements.txt
      - name: Query public samples without credentials
        run: python -B tools/public_check.py --suite all --allow-failures --output "$RUNNER_TEMP/public-validation.json"
      - name: Verify empty results, catalog and numeric samples separately
        run: python -B tools/capability_check.py --suite all --allow-failures --output "$RUNNER_TEMP/capability-validation.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-validation-linux
          path: |
            ${{ runner.temp }}/public-validation.json
            ${{ runner.temp }}/capability-validation.json
